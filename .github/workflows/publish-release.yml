name: Publish signed OktoDrive APK

# Only publish releases with a persistent signing key. This prevents
# uninstall/reinstall failures caused by GitHub's ephemeral debug key.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require persistent signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.OKTODRIVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OKTODRIVE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OKTODRIVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OKTODRIVE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Persistent signing credentials must be configured before publishing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oktodrive-release.jks"
          echo "OKTODRIVE_KEYSTORE_PATH=$RUNNER_TEMP/oktodrive-release.jks" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed release
        env:
          OKTODRIVE_STORE_PASSWORD: ${{ secrets.OKTODRIVE_STORE_PASSWORD }}
          OKTODRIVE_KEY_ALIAS: ${{ secrets.OKTODRIVE_KEY_ALIAS }}
          OKTODRIVE_KEY_PASSWORD: ${{ secrets.OKTODRIVE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "OktoDrive-$VERSION.apk"
          gh release create "v$VERSION" "OktoDrive-$VERSION.apk" --title "OktoDrive v$VERSION" --notes "Android testversjon. Installer med samme signeringsnøkkel for fremtidige oppdateringer." --target "$GITHUB_SHA"
