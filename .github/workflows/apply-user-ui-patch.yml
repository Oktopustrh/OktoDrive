name: Apply user UI source patch

on:
  push:
    paths:
      - '.github/workflows/apply-user-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foreground-mumble-logging
          fetch-depth: 0
      - name: Patch MainActivity user list UI
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/no/oktodrive/app/MainActivity.kt')
          text = path.read_text()

          old = '''    private lateinit var channelList: LinearLayout\n    private lateinit var activeChannelText: TextView\n'''
          new = '''    private lateinit var channelList: LinearLayout\n    private lateinit var userList: LinearLayout\n    private lateinit var activeChannelText: TextView\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    private var channels: List<MumbleClient.Channel> = emptyList()\n    private var activeChannelId: Int? = null\n'''
          new = '''    private var channels: List<MumbleClient.Channel> = emptyList()\n    private var users: List<MumbleClient.User> = emptyList()\n    private var activeChannelId: Int? = null\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''            override fun onActiveChannel(channelId: Int) {\n                runOnUiThread {\n                    activeChannelId = channelId\n                    updateActiveChannelLabel()\n                    renderChannels()\n                }\n            }\n\n            override fun onError(message: String) {\n'''
          new = '''            override fun onActiveChannel(channelId: Int) {\n                runOnUiThread {\n                    activeChannelId = channelId\n                    updateActiveChannelLabel()\n                    renderChannels()\n                    renderUsers()\n                }\n            }\n\n            override fun onUsers(users: List<MumbleClient.User>) {\n                runOnUiThread {\n                    this@MainActivity.users = users\n                    renderUsers()\n                }\n            }\n\n            override fun onError(message: String) {\n'''
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''    private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()\n'''
          insertion = '''    private fun renderUsers() {\n        if (!::userList.isInitialized) return\n        userList.removeAllViews()\n        val channelUsers = users.filter { it.channelId == activeChannelId }\n        if (channelUsers.isEmpty()) {\n            userList.addView(text("Ingen brukere i aktiv talegruppe.", 14f, muted))\n            return\n        }\n\n        channelUsers.forEachIndexed { index, user ->\n            val state = when {\n                user.selfDeaf -> "  · døvet"\n                user.selfMute || user.mutedByServer || user.suppressed -> "  · dempet"\n                else -> ""\n            }\n            userList.addView(text("•  ${user.name}$state", 15f, navy))\n            if (index != channelUsers.lastIndex) userList.addView(spacer(4))\n        }\n    }\n\n'''
          assert marker in text
          text = text.replace(marker, insertion + marker, 1)

          old = '''        activeChannelText = text("👥  Aktiv talegruppe:   Ingen", 16f, navy, true)\n        channelCard.addView(activeChannelText)\n        channelCard.addView(spacer(10))\n        channelCard.addView(text("◉  Dobbeltvakt:   Ikke aktiv", 16f, navy, true))\n'''
          new = '''        activeChannelText = text("👥  Aktiv talegruppe:   Ingen", 16f, navy, true)\n        channelCard.addView(activeChannelText)\n        channelCard.addView(spacer(10))\n        channelCard.addView(text("Brukere i aktiv talegruppe", 14f, muted, true))\n        channelCard.addView(spacer(6))\n        userList = LinearLayout(this).apply {\n            orientation = LinearLayout.VERTICAL\n        }\n        channelCard.addView(userList)\n        renderUsers()\n        channelCard.addView(spacer(10))\n        channelCard.addView(text("◉  Dobbeltvakt:   Ikke aktiv", 16f, navy, true))\n'''
          assert old in text
          text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/no/oktodrive/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Show users in active Mumble channel"
          git push origin HEAD:fix/foreground-mumble-logging
