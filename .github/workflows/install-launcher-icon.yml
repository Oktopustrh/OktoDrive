name: Install launcher icon

on:
  push:
    paths:
      - '.github/assets/oktodrive_launcher.webp.b64'

permissions:
  contents: write

jobs:
  install-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 --decode .github/assets/oktodrive_launcher.webp.b64 > app/src/main/res/drawable/oktodrive_launcher.webp
      - name: Commit launcher icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/oktodrive_launcher.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add OktoDrive octopus launcher icon"
          git push
