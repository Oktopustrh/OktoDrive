name: Apply PTT audio path

on:
  push:
    branches:
      - feature/opus-audio-prep
    paths:
      - .github/workflows/apply-ptt-audio.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/opus-audio-prep
      - name: Apply source patch
        run: python3 scripts/apply_ptt_audio_patch.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/no/oktodrive/app/MumbleClient.kt app/src/main/java/no/oktodrive/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Wire hold-to-talk microphone audio into Mumble tunnel"
          git push
