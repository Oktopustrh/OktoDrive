name: Apply default Mumble server

on:
  push:
    branches: [ feature/opus-audio-prep ]
    paths:
      - '.github/workflows/apply-default-server.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/opus-audio-prep
      - name: Set Veiens Venner server as default
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/no/oktodrive/app/MainActivity.kt')
          s = p.read_text()
          s = s.replace('prefs.getString("host", "") ?: ""', 'prefs.getString("host", "ts.veiensvenner.no") ?: "ts.veiensvenner.no"')
          s = s.replace('hint = "mumble.example.no"', 'hint = "ts.veiensvenner.no"')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/no/oktodrive/app/MainActivity.kt
          git commit -m "Use ts.veiensvenner.no as default Mumble server"
          git push
