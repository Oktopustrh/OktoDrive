name: Apply receive audio TCP tunnel fix

on:
  push:
    branches: [ feature/opus-audio-prep ]
    paths:
      - '.github/workflows/apply-receive-audio-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/opus-audio-prep
      - name: Force tunneled receive audio and update client version
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/no/oktodrive/app/MumbleClient.kt')
          s = p.read_text()

          s = s.replace('.setRelease("OktoDrive 0.1")', '.setRelease("OktoDrive 0.1.8")')

          old = '''                                        Log.i(TAG, "ServerSync received; ownSession=$ownSession")
                                        listener.onStatus("Tilkoblet Mumble som $username", true)'''
          new = '''                                        Log.i(TAG, "ServerSync received; ownSession=$ownSession")
                                        // OktoDrive does not use Mumble's encrypted UDP transport yet.
                                        // Sending one valid tunneled terminator tells the server to route
                                        // voice back through the TLS/TCP UDPTunnel path immediately.
                                        forceTcpVoiceTunnel(output)
                                        listener.onStatus("Tilkoblet Mumble som $username", true)'''
          if old not in s:
              raise SystemExit('ServerSync marker not found')
          s = s.replace(old, new, 1)

          old_udp = '''                                    TYPE_UDP_TUNNEL -> {
                                        handleIncomingVoicePacket(payload)
                                    }'''
          new_udp = '''                                    TYPE_UDP_TUNNEL -> {
                                        Log.d(TAG, "Incoming tunneled voice bytes=$length")
                                        handleIncomingVoicePacket(payload)
                                    }'''
          if old_udp in s:
              s = s.replace(old_udp, new_udp, 1)

          marker = '''    fun sendVoiceFrame(opusData: ByteArray, frameNumber: Long, terminator: Boolean): Boolean {'''
          method = '''    private fun forceTcpVoiceTunnel(output: DataOutputStream) {
        try {
            val probe = buildVoicePacket(ByteArray(0), 0L, true)
            send(output, TYPE_UDP_TUNNEL, probe)
            Log.i(TAG, "Forced Mumble voice transport to TLS/TCP tunnel")
        } catch (e: Exception) {
            Log.w(TAG, "Could not force TCP voice tunnel", e)
        }
    }

'''
          if marker not in s:
              raise SystemExit('sendVoiceFrame marker not found')
          s = s.replace(marker, method + marker, 1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/no/oktodrive/app/MumbleClient.kt
          git commit -m "Force tunneled Mumble receive audio"
          git push
