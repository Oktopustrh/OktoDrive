name: Android build

on:
  push:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare persistent test signing when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.OKTODRIVE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oktodrive-test.jks"
            echo "OKTODRIVE_TEST_KEYSTORE_PATH=$RUNNER_TEMP/oktodrive-test.jks" >> "$GITHUB_ENV"
            echo "Stable signing enabled for this development build."
          else
            echo "::warning::Persistent signing secret is not configured; this build will use Android's temporary debug key."
          fi
      - name: Embed test version and tunneled receive-audio probe
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          m = re.search(r'versionName\s*=\s*"([^"]+)"', g)
          if not m:
              raise SystemExit('versionName not found')
          base = m.group(1)
          display = f"{base}.{os.environ['GITHUB_RUN_NUMBER']}"
          g = g[:m.start(1)] + display + g[m.end(1):]
          gradle.write_text(g)
          print(f'OktoDrive test build: {display}')

          main = Path('app/src/main/java/no/oktodrive/app/MainActivity.kt')
          s = main.read_text()
          old = 'addView(text("OktoDrive", 28f, navy, true))'
          new = f'addView(text("OktoDrive\\n{display}", 28f, navy, true))'
          if old not in s:
              raise SystemExit('OktoDrive title marker not found')
          main.write_text(s.replace(old, new, 1))

          mumble = Path('app/src/main/java/no/oktodrive/app/MumbleClient.kt')
          s = mumble.read_text()
          s, n = re.subn(
              r'\.setRelease\("OktoDrive [^"]*"\)',
              f'.setRelease("OktoDrive {display}")',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('Mumble release marker not found')

          import_marker = 'import no.oktodrive.app.proto.udp.Audio as UdpAudio\n'
          if 'import no.oktodrive.app.proto.udp.Ping as UdpPing' not in s:
              if import_marker not in s:
                  raise SystemExit('UDP Audio import marker not found')
              s = s.replace(
                  import_marker,
                  import_marker + 'import no.oktodrive.app.proto.udp.Ping as UdpPing\n',
                  1,
              )

          sync_marker = '                ownSession = if (sync.hasSession()) sync.session else null\n'
          if 'forceTcpTunnel()' not in s:
              if sync_marker not in s:
                  raise SystemExit('ServerSync marker not found')
              s = s.replace(
                  sync_marker,
                  sync_marker + '                forceTcpTunnel()\n',
                  1,
              )

          method_marker = '    private fun handleIncomingVoicePacket(packet: ByteArray) {\n'
          if 'private fun forceTcpTunnel()' not in s:
              if method_marker not in s:
                  raise SystemExit('incoming voice marker not found')
              method = '''    private fun forceTcpTunnel() {
        val output = controlOutput ?: return
        try {
            val ping = UdpPing.newBuilder()
                .setTimestamp(System.currentTimeMillis())
                .build()
                .toByteArray()
            val packet = ByteArray(ping.size + 1)
            packet[0] = UDP_TYPE_PING.toByte()
            ping.copyInto(packet, destinationOffset = 1)
            send(output, TYPE_UDP_TUNNEL, packet)
            Log.i(TAG, "Sent tunneled UDP ping; receive audio should stay on TCP tunnel")
        } catch (e: Exception) {
            Log.w(TAG, "Could not request tunneled receive audio", e)
        }
    }

'''
              s = s.replace(method_marker, method + method_marker, 1)

          const_marker = '        private const val UDP_TYPE_AUDIO = 0\n'
          if 'private const val UDP_TYPE_PING = 1' not in s:
              if const_marker not in s:
                  raise SystemExit('UDP audio constant marker not found')
              s = s.replace(
                  const_marker,
                  const_marker + '        private const val UDP_TYPE_PING = 1\n',
                  1,
              )

          mumble.write_text(s)
          PY
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build development APK
        env:
          OKTODRIVE_TEST_STORE_PASSWORD: ${{ secrets.OKTODRIVE_STORE_PASSWORD }}
          OKTODRIVE_TEST_KEY_ALIAS: ${{ secrets.OKTODRIVE_KEY_ALIAS }}
          OKTODRIVE_TEST_KEY_PASSWORD: ${{ secrets.OKTODRIVE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload development APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: oktodrive-dev-apk
          archive: false
          path: app/build/outputs/apk/debug/*.apk
